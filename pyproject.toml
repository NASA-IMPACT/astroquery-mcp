[project]
name = "astroquery-mcp"
version = "0.1.0"
description = "MCP server for astronomical data queries via astroquery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "astroquery>=0.4",
    "fastmcp>=2.14.2",
    "mcp>=1.25.0",
]

[project.scripts]
astroquery-mcp = "server:main"

[tool.fastmcp]
name = "astroquery-mcp"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
docs = [
    "docstring-parser>=0.17.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# Tests that hit live archives (ADS, SIMBAD, XMM, ...) are opt-in: `pytest -m network`
addopts = "-m 'not network'"
markers = ["network: test calls a live remote service"]
