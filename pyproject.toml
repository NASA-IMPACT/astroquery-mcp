[project]
name = "astroquery-mcp"
version = "0.1.0"
description = "MCP server for astronomical data queries via astroquery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.1",
    "astroquery>=0.4.10",
    "fastmcp>=2.14.2",
    "httpx>=0.28.1",
    "mcp>=1.25.0",
    "numpy>=1.24",
    "pydantic>=2.11.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.scripts]
astroquery-mcp = "server:main"

[tool.fastmcp]
name = "astroquery-mcp"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
docs = [
    "docstring-parser>=0.17.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# Tests that hit live archives (ADS, SIMBAD, XMM, ...) are opt-in: `pytest -m network`
addopts = "-m 'not network'"
markers = ["network: test calls a live remote service"]

[tool.uv.dependency-groups]
# Docs are only built on recent Python (Sphinx 9 needs 3.12+); the package itself supports 3.10+
docs = { requires-python = ">=3.12" }
